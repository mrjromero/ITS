<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interoffice Package Tracker</title>
  <!-- Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #333; }
    h1 { font-size: 1.8rem; }
    h2 { border-bottom: 2px solid #0052cc; padding-bottom: 0.5rem; margin-top: 2rem; font-size: 1.4rem; }
    
    /* Form Styles */
    form { background: #f4f5f7; padding: 1.5rem; border-radius: 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full-width { grid-column: 1 / -1; }
    label { display: block; font-weight: bold; margin-bottom: 0.4rem; font-size: 0.9em; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    
    /* Buttons */
    .btn-group { margin-top: 1.5rem; display: flex; gap: 10px; }
    button { padding: 12px 20px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; }
    .primary-btn { background: #0052cc; color: white; }
    .primary-btn:hover { background: #0043a8; }
    .secondary-btn { background: #6c757d; color: white; }
    .secondary-btn:hover { background: #5a6268; }
    
    /* Filter and Sort Controls */
    .table-controls { background: #f4f5f7; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .control-group { flex: 1; min-width: 150px; }
    .control-group label { font-size: 0.8em; margin-bottom: 0.2rem; }
    #searchInput { border: 2px solid #0052cc; }
    
    /* Table Styles */
    .table-responsive { width: 100%; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th, td { border: 1px solid #ddd; padding: 12px 10px; text-align: left; }
    th { background-color: #0052cc; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* Status Badges */
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.85em; font-weight: bold; white-space: nowrap; }
    .status-mailroom { background: #ffeeba; color: #856404; }
    .status-transit { background: #b8daff; color: #004085; }
    .status-delivered { background: #c3e6cb; color: #155724; }
    
    /* Action Buttons */
    .action-btn { padding: 6px 10px; font-size: 0.85em; margin-right: 4px; margin-bottom: 4px; }
    .edit-btn { background: #ffc107; color: black; }
    .delete-btn { background: #dc3545; color: white; }
    
    #statusMsg { color: #0052cc; font-weight: bold; margin-bottom: 1rem; height: 20px; }
    #reader { width: 100%; max-width: 400px; margin-top: 10px; display: none; border-radius: 4px; overflow: hidden; }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; } 
      .full-width { grid-column: auto; }
      .btn-group { flex-direction: column; } 
      .btn-group button { width: 100%; } 
      .control-group { min-width: 100%; }
      
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      tr { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 1rem; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 0.5rem; }
      td { border: none; border-bottom: 1px solid #eee; position: relative; padding: 10px 10px 10px 40%; min-height: 30px; text-align: right; }
      td:last-child { border-bottom: 0; text-align: right; }
      td::before { content: attr(data-label); position: absolute; left: 10px; width: 35%; padding-right: 10px; font-weight: bold; color: #555; text-align: left; }
    }
  </style>
</head>
<body>

  <h1>Interoffice Package Tracker</h1>
  <div id="statusMsg"></div>
  
  <form id="dataForm">
    <input type="hidden" id="itemId">
    
    <div class="form-grid">
      <div class="full-width">
        <label>Tracking Number / Carrier</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="pkgTracking" placeholder="e.g., FedEx 1Z999..." required>
          <button type="button" class="secondary-btn" onclick="toggleScanner()" style="white-space: nowrap;">📷 Scan</button>
        </div>
        <div id="reader"></div>
      </div>
      
      <div>
        <label>Date & Time Received</label>
        <input type="datetime-local" id="pkgDate" required>
      </div>
      <div>
        <label>Recipient Name</label>
        <input type="text" id="pkgRecipient" required>
      </div>
      <div>
        <label>Department</label>
        <select id="pkgDept" required>
          <option value="">Select Department...</option>
          <option value="HR">HR</option>
          <option value="IT">IT</option>
          <option value="Executive">Executive</option>
          <option value="Accounting">Accounting</option>
          <option value="Marketing">Marketing</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label>Sender / Vendor</label>
        <input type="text" id="pkgSender" placeholder="e.g., Amazon, Dell, Jane Doe" required>
      </div>
      <div>
        <label>Current Status</label>
        <select id="pkgStatus" required>
          <option value="At Mailroom">At Mailroom</option>
          <option value="In Transit (Internal)">In Transit (Internal)</option>
          <option value="Delivered">Delivered</option>
        </select>
      </div>
      <div class="full-width">
        <label>Notes (Optional)</label>
        <textarea id="pkgNotes" rows="2" placeholder="Damage reported, needs signature, etc."></textarea>
      </div>
    </div>

    <div class="btn-group">
      <button type="submit" id="submitBtn" class="primary-btn">Log Package</button>
      <button type="button" id="cancelBtn" class="secondary-btn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
    </div>
  </form>

  <h2>Package Inventory</h2>
  
  <div class="table-controls">
    <!-- NEW: Server-Side Time Range Filter -->
    <div class="control-group">
      <label>Time Range</label>
      <select id="timeRange" onchange="loadData()">
        <option value="3">Last 3 Months (Fast)</option>
        <option value="6">Last 6 Months</option>
        <option value="12">Last 1 Year</option>
        <option value="all">All Time (Slower)</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Search All Fields</label>
      <input type="text" id="searchInput" placeholder="Search..." onkeyup="renderTable()">
    </div>
    <div class="control-group">
      <label>Filter by Status</label>
      <select id="filterStatus" onchange="renderTable()">
        <option value="">All Statuses</option>
        <option value="At Mailroom">At Mailroom</option>
        <option value="In Transit (Internal)">In Transit</option>
        <option value="Delivered">Delivered</option>
      </select>
    </div>
    <div class="control-group">
      <label>Filter by Department</label>
      <select id="filterDept" onchange="renderTable()">
        <option value="">All Departments</option>
        <option value="HR">HR</option>
        <option value="IT">IT</option>
        <option value="Executive">Executive</option>
        <option value="Accounting">Accounting</option>
        <option value="Marketing">Marketing</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="control-group">
      <label>Sort By</label>
      <select id="sortBy" onchange="renderTable()">
        <option value="dateAsc">Date (Earliest to Latest)</option>
        <option value="dateDesc">Date (Latest to Earliest)</option>
        <option value="recipientAsc">Recipient (A-Z)</option>
        <option value="deptAsc">Department (A-Z)</option>
      </select>
    </div>
    <div class="control-group" style="flex: 0; min-width: auto;">
       <button onclick="loadData()" class="primary-btn" style="height: 100%;">Refresh</button>
    </div>
  </div>
  
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Date & Time (EDT)</th>
          <th>Tracking / Carrier</th>
          <th>Recipient</th>
          <th>Dept</th>
          <th>Sender</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7">Loading packages...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw_zV8BJ1Lcdnc36vSfhUUDxCpXOaYpa8H95eQQjP6iu33TfiilTgy247keK44gH_ZKfQ/exec";
    
    let packageData = [];

    function setCurrentDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('pkgDate').value = now.toISOString().slice(0, 16);
    }
    setCurrentDateTime();

    // --- Barcode Scanner Logic ---
    let html5QrCode;
    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { readerDiv.style.display = 'none'; });
        return;
      }
      readerDiv.style.display = 'block';
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 100 } }, (decodedText) => {
        document.getElementById('pkgTracking').value = decodedText;
        html5QrCode.stop().then(() => { readerDiv.style.display = 'none'; });
      }, () => {}).catch(err => {
        alert("Camera error. Please ensure you have granted permissions.");
        readerDiv.style.display = 'none';
      });
    }
    // ----------------------------

    // Fetch data with the Time Range Parameter attached
    async function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Fetching data from Google Sheets...</td></tr>';
      
      try {
        const timeRange = document.getElementById('timeRange').value;
        const fetchUrl = `${API_URL}?monthsBack=${timeRange}`;
        
        const response = await fetch(fetchUrl);
        const data = await response.json();
        
        packageData = data.filter(row => row.ID);
        renderTable(); 
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Error loading data.</td></tr>';
        console.error(error);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      
      const filterText = document.getElementById('searchInput').value.toLowerCase();
      const filterStatus = document.getElementById('filterStatus').value;
      const filterDept = document.getElementById('filterDept').value;
      const sortBy = document.getElementById('sortBy').value;

      let filteredData = packageData.filter(row => {
        const rowText = Object.values(row).join(" ").toLowerCase();
        const matchesText = rowText.includes(filterText);
        const matchesStatus = filterStatus === "" || row['Status'] === filterStatus;
        const matchesDept = filterDept === "" || row['Department'] === filterDept;
        
        return matchesText && matchesStatus && matchesDept;
      });

      filteredData.sort((a, b) => {
        if (sortBy === 'dateAsc') return new Date(a['Date Received']) - new Date(b['Date Received']);
        if (sortBy === 'dateDesc') return new Date(b['Date Received']) - new Date(a['Date Received']);
        if (sortBy === 'recipientAsc') return (a['Recipient'] || '').localeCompare(b['Recipient'] || '');
        if (sortBy === 'deptAsc') return (a['Department'] || '').localeCompare(b['Department'] || '');
      });

      tbody.innerHTML = '';
      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No packages match your criteria.</td></tr>';
        return;
      }

      filteredData.forEach(row => {
        let statusBadge = 'badge ';
        if (row.Status === 'At Mailroom') statusBadge += 'status-mailroom';
        else if (row.Status === 'In Transit (Internal)') statusBadge += 'status-transit';
        else if (row.Status === 'Delivered') statusBadge += 'status-delivered';

        let displayDate = "";
        if (row['Date Received']) {
          const d = new Date(row['Date Received']);
          if (!isNaN(d)) {
            displayDate = d.toLocaleString('en-US', { 
              timeZone: 'America/New_York', 
              year: 'numeric', month: 'short', day: 'numeric', 
              hour: 'numeric', minute: '2-digit' 
            }) + " EDT";
          }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td data-label="Date/Time">${escapeHTML(displayDate)}</td>
          <td data-label="Tracking"><strong>${escapeHTML(row['Tracking Number'])}</strong><br><small>${escapeHTML(row['Notes'])}</small></td>
          <td data-label="Recipient">${escapeHTML(row['Recipient'])}</td>
          <td data-label="Dept">${escapeHTML(row['Department'])}</td>
          <td data-label="Sender">${escapeHTML(row['Sender'])}</td>
          <td data-label="Status"><span class="${statusBadge}">${escapeHTML(row.Status)}</span></td>
          <td data-label="Actions">
            <button class="action-btn edit-btn" onclick="editRecord(
              '${row.ID}', 
              '${escapeHTML(row['Tracking Number'])}', 
              '${escapeHTML(row['Recipient'])}', 
              '${escapeHTML(row['Department'])}', 
              '${escapeHTML(row['Sender'])}', 
              '${escapeHTML(row['Date Received'])}', 
              '${escapeHTML(row['Status'])}', 
              '${escapeHTML(row['Notes'])}'
            )">Edit</button>
            <button class="action-btn delete-btn" onclick="deleteRecord('${row.ID}')">Del</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function sendData(action, dataObj) {
      const payload = { action: action, data: dataObj };
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        setTimeout(() => {
          loadData();
          document.getElementById('statusMsg').textContent = "";
        }, 1500);
      } catch (error) {
        alert("Error communicating with the database.");
      }
    }

    document.getElementById('dataForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('statusMsg').textContent = "Syncing with Google Sheets...";

      const id = document.getElementById('itemId').value;
      const dataObj = {
        "Tracking Number": document.getElementById('pkgTracking').value,
        "Recipient": document.getElementById('pkgRecipient').value,
        "Department": document.getElementById('pkgDept').value,
        "Sender": document.getElementById('pkgSender').value,
        "Date Received": document.getElementById('pkgDate').value,
        "Status": document.getElementById('pkgStatus').value,
        "Notes": document.getElementById('pkgNotes').value
      };

      if (id) sendData('update', dataObj);
      else sendData('create', dataObj);
      
      resetForm();
    });

    function editRecord(id, track, rec, dept, sender, date, status, notes) {
      document.getElementById('itemId').value = id;
      document.getElementById('pkgTracking').value = track;
      document.getElementById('pkgRecipient').value = rec;
      document.getElementById('pkgDept').value = dept;
      document.getElementById('pkgSender').value = sender;
      document.getElementById('pkgStatus').value = status;
      document.getElementById('pkgNotes').value = notes;
      
      if (date) {
        const d = new Date(date);
        if (!isNaN(d)) {
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          document.getElementById('pkgDate').value = d.toISOString().slice(0, 16);
        }
      }

      document.getElementById('submitBtn').textContent = "Update Package";
      document.getElementById('cancelBtn').style.display = "inline-block";
      window.scrollTo(0, 0);
    }

    function deleteRecord(id) {
      if (confirm("Permanently delete this package record?")) {
        document.getElementById('statusMsg').textContent = "Deleting...";
        sendData('delete', { ID: id });
      }
    }

    function resetForm() {
      document.getElementById('dataForm').reset();
      document.getElementById('itemId').value = "";
      document.getElementById('submitBtn').textContent = "Log Package";
      document.getElementById('cancelBtn').style.display = "none";
      setCurrentDateTime();
    }

    function escapeHTML(str) {
      if (!str) return "";
      return str.toString().replace(/[&<>'"]/g, 
        tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
      );
    }

    // Initialize App
    loadData();
  </script>
</body>
</html>
