<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0056b3">
<title>Attendee Departure Information</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--primary:#0056b3;--hover:#004494;--success:#28a745;--bg:#f4f7f9;--card:#fff;--text:#334155;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:900px;margin:0 auto;padding:25px 15px;background:var(--bg);color:var(--text);line-height:1.5}.card{background:var(--card);padding:25px 30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:25px;position:relative}.lang-wrap{position:absolute;top:25px;right:30px}.lang{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:var(--text)}.title{display:flex;gap:10px;align-items:center;padding-right:140px}h2{color:var(--primary);margin:0 0 10px;font-size:1.6rem}p{color:var(--muted);margin-top:0}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}input[type=text]{width:100%;padding:14px 16px;margin:15px 0 5px;border:2px solid #cbd5e1;border-radius:8px;font-size:16px;outline:none}input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,86,179,.15)}button{cursor:pointer}.action{background:var(--primary);color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:600;min-height:44px}.action:hover{background:var(--hover)}.copied{background:var(--success)!important}.name-btn{background:#f1f5f9;color:var(--text);border:1px solid #cbd5e1;margin:0 8px 8px 0;padding:10px 16px;border-radius:6px;font-size:15px}.name-btn:hover{background:#e2e8f0}.name-btn.active{background:var(--success);color:#fff;border-color:var(--success)}.hidden{display:none!important}.status{margin-top:12px;font-size:14px}.status.error{padding:12px 14px;border-left:5px solid #b91c1c;background:#fef2f2;color:#991b1b;border-radius:0 6px 6px 0}.notice{background:#f0f9ff;border-left:6px solid #0ea5e9;padding:18px 20px;border-radius:0 8px 8px 0;margin-bottom:25px}.notice.bad{background:#fff7ed;border-left-color:#f97316}.notice h3{margin-top:0;border:0;color:#075985}.notice.bad h3,.notice.bad p{color:#9a3412}.highlight{font-size:1.15em;font-weight:700;color:#b91c1c;background:#fff;padding:4px 10px;border-radius:6px;border:1px solid #fecaca}.table-wrap{width:100%;overflow-x:auto;margin-bottom:30px;border-radius:8px;border:1px solid var(--border)}table{width:100%;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc;width:35%;font-weight:700;color:#475569;text-transform:uppercase;font-size:12px}.date-row td{background:#e2e8f0!important;font-weight:700;color:#1e293b}.pdf-bar{margin-top:30px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}.pdf{background:#0f172a}.page-break{page-break-before:always;break-before:page;height:0}.copy-bar{margin-top:15px}
@media(max-width:600px){body{padding:12px 10px}.card{padding:20px 15px}.lang-wrap{position:relative;top:0;right:0;margin-bottom:15px;text-align:right}.title{padding-right:0;flex-wrap:wrap}.action,.name-btn{width:100%;font-size:16px;padding:14px}.pdf-bar{justify-content:stretch}th,td{padding:12px 10px}}
</style>
</head>
<body>
<div class="card">
<div class="lang-wrap"><label class="sr" for="lang">Language</label><select id="lang" class="lang"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div>
<div class="title"><h2 id="title">Attendee Departure Search</h2></div>
<p id="desc">Search for your name to retrieve your departure information and hotel departure schedule.</p>
<div id="upload" class="hidden"><p id="upload-msg">Browser security prevented auto-loading. Select the workbook manually.</p><label id="upload-label" for="file">Select departures.xlsx:</label><br><input type="file" id="file" accept=".xlsx,.xls"></div>
<div id="search" class="hidden"><label class="sr" id="search-label" for="q">Attendee name</label><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Type your name to search..."><div id="results" aria-live="polite"></div></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</div>
<div id="export" class="card hidden"><div id="printable"></div><div class="pdf-bar"><button id="pdf" class="action pdf" type="button">📄 Download as PDF</button></div></div>
<script>
(()=>{"use strict";
const FILE="departures.xlsx",SHEET="Departure Schedule",REQ=["Date","Time","Flight","Name","PAX","Union","Airline"],SHOW=[...REQ];
const M={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
const T={en:{title:"Attendee Departure Search",desc:"Search for your name to retrieve your departure information and hotel departure schedule.",ph:"Type your name to search...",label:"Attendee name",upload:"Browser security prevented auto-loading. Select the workbook manually.",file:"Select departures.xlsx:",none:"No matches found.",info:"Attendee Departure Information",notice:"🚐 Hotel Departure Notice",based:"Based on your flight scheduled for {time} on {date}:",meet:"Please meet transportation in the hotel lobby at",unresolved:"We could not determine your hotel departure time automatically. Please check the Hotel Departure Schedule below or contact the transportation desk.",schedule:"Hotel Departure Schedule",copy:"📋 Copy to Clipboard",copied:"✓ Copied!",pdf:"📄 Download as PDF",load:"The workbook could not be loaded.",bad:"The workbook structure or schedule is invalid. Automatic departure lookup has been disabled."},es:{title:"Búsqueda de Salida de Asistentes",desc:"Busque su nombre para recuperar su información de salida y el horario de salida del hotel.",ph:"Escriba su nombre para buscar...",label:"Nombre del asistente",upload:"La seguridad del navegador impidió la carga automática. Seleccione manualmente el libro.",file:"Seleccione departures.xlsx:",none:"No se encontraron coincidencias.",info:"Información de Salida del Asistente",notice:"🚐 Aviso de Salida del Hotel",based:"Basado en su vuelo programado para las {time} el {date}:",meet:"Por favor, reúnase con el transporte en el lobby del hotel a las",unresolved:"No pudimos determinar automáticamente su hora de salida del hotel. Consulte el Horario de Salida del Hotel a continuación o comuníquese con el equipo de transporte.",schedule:"Horario de Salida del Hotel",copy:"📋 Copiar al Portapapeles",copied:"✓ ¡Copiado!",pdf:"📄 Descargar como PDF",load:"No se pudo cargar el libro.",bad:"La estructura o el horario del libro no es válido. La búsqueda automática de salida ha sido deshabilitada."},fr:{title:"Recherche de Départ des Participants",desc:"Recherchez votre nom pour récupérer vos informations de départ et l'horaire de départ de l'hôtel.",ph:"Tapez votre nom pour rechercher...",label:"Nom du participant",upload:"La sécurité du navigateur a empêché le chargement automatique. Sélectionnez manuellement le classeur.",file:"Sélectionnez departures.xlsx :",none:"Aucun résultat trouvé.",info:"Informations de Départ du Participant",notice:"🚐 Avis de Départ de l'Hôtel",based:"Basé sur votre vol prévu à {time} le {date} :",meet:"Veuillez rejoindre le transport dans le hall de l'hôtel à",unresolved:"Nous n'avons pas pu déterminer automatiquement l'heure de départ de l'hôtel. Consultez l'Horaire de Départ de l'Hôtel ci-dessous ou contactez l'équipe de transport.",schedule:"Horaire de Départ de l'Hôtel",copy:"📋 Copier dans le Presse-papiers",copied:"✓ Copié !",pdf:"📄 Télécharger en PDF",load:"Le classeur n'a pas pu être chargé.",bad:"La structure ou l'horaire du classeur est invalide. La recherche automatique de départ a été désactivée."}};
let lang="en",people=[],rules=[],active=null,clip="";const $=id=>document.getElementById(id);
function status(s,e=false){$("status").textContent=s||"";$("status").className="status"+(e?" error":"")}
function norm(s){return String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
function date(s){s=String(s??"").trim().toLowerCase().replace(/\./g,"");let x=s.match(/^(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?$/);if(x){let y=x[3]?+x[3]:null;if(y&&y<100)y+=2000;return {y,m:+x[1],d:+x[2]}}x=s.match(/^([a-z]+)\s+(\d{1,2})(?:,?\s+(\d{4}))?$/);if(x&&M[x[1]])return {y:x[3]?+x[3]:null,m:M[x[1]],d:+x[2]};return null}
function key(d){return d&&d.y?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:null}
function time(s){s=String(s??"").trim().toLowerCase().replace(/\./g,"");let x=s.match(/^(1[0-2]|0?[1-9]):([0-5]\d)\s*(am|pm)$/);if(!x)return null;let h=+x[1],m=+x[2];if(x[3]==="am"&&h===12)h=0;if(x[3]==="pm"&&h!==12)h+=12;return h*60+m}
function range(s){s=String(s??"").trim();let p=s.replace(/[–—]/g,"-").split(/\s*-\s*/);if(p.length!==2)return null;let a=time(p[0]),b=time(p[1]);return a===null||b===null||b<a?null:{a,b,text:s}}
function cells(r){return r.map((v,i)=>({i,v:String(v??"").trim()})).filter(x=>x.v)}
function buildSchedule(ws){let rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}),out=[],cur=null;for(const r of rows){let c=cells(r);if(!c.length)continue;if(c.length===1){let d=date(c[0].v);if(d&&d.y){cur=d;continue}}let rc=c.find(z=>range(z.v));if(!rc)continue;if(!cur)throw Error("Schedule range before dated section");let rg=range(rc.v),dc=c.find(z=>z.i>rc.i&&time(z.v)!==null);if(!dc)throw Error(`Invalid hotel departure time for ${rg.text}`);out.push({date:cur,key:key(cur),a:rg.a,b:rg.b,range:rg.text,dep:dc.v})}if(!out.length)throw Error("No valid schedule rules");let groups={};for(const r of out)(groups[r.key]??=[]).push(r);for(const k in groups){groups[k].sort((a,b)=>a.a-b.a);for(let i=1;i<groups[k].length;i++)if(groups[k][i].a<=groups[k][i-1].b)throw Error(`Overlapping ranges on ${k}`)}return out}
function attendee(ws){let rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:""});if(!rows.length)return[];let miss=REQ.filter(h=>!Object.keys(rows[0]).includes(h));if(miss.length)throw Error(`Missing columns: ${miss.join(", ")}`);return rows.filter(r=>String(r.Name).trim())}
function resolveDate(s){let d=date(s);if(!d)return null;if(d.y){let k=key(d);return rules.some(r=>r.key===k)?k:null}let ks=[...new Set(rules.filter(r=>r.date.m===d.m&&r.date.d===d.d).map(r=>r.key))];return ks.length===1?ks[0]:null}
function departure(d,t){let k=resolveDate(d),m=time(t);if(!k||m===null)return null;let hit=rules.filter(r=>r.key===k&&m>=r.a&&m<=r.b);return hit.length===1?hit[0].dep:null}
function el(tag,text,cls){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function infoTable(p){let box=document.createElement("div");box.append(el("h3",T[lang].info));let w=el("div",undefined,"table-wrap"),tb=document.createElement("table");for(const k of SHOW){let tr=document.createElement("tr");tr.append(el("th",k),el("td",String(p[k]??"")));tb.append(tr)}w.append(tb);box.append(w);return box}
function scheduleTable(){let box=document.createElement("div");box.append(el("h3",T[lang].schedule));let w=el("div",undefined,"table-wrap"),tb=document.createElement("table"),groups={};for(const r of rules)(groups[r.key]??=[]).push(r);for(const k of Object.keys(groups)){let tr=el("tr",undefined,"date-row"),td=el("td",k);td.colSpan=2;tr.append(td);tb.append(tr);let hd=document.createElement("tr");hd.append(el("th","Flight Time Between"),el("th","Departure From Hotel"));tb.append(hd);for(const r of groups[k].sort((a,b)=>a.a-b.a)){let rr=document.createElement("tr");rr.append(el("td",r.range),el("td",r.dep));tb.append(rr)}}w.append(tb);box.append(w);return box}
function display(p,scroll=false){active=p;let L=T[lang],out=$("printable");out.replaceChildren();let dep=departure(p.Date,p.Time),n=el("div",undefined,"notice"+(dep?"":" bad"));n.id="notice";n.append(el("h3",L.notice),el("p",L.based.replace("{time}",p.Time||"Unknown").replace("{date}",p.Date||"Unknown")));if(dep){let q=el("p");q.append(document.createTextNode(L.meet+" "),el("span",dep,"highlight"),document.createTextNode("."));n.append(q)}else n.append(el("p",L.unresolved));let bar=el("div",undefined,"copy-bar no-pdf"),b=el("button",L.copy,"action");b.type="button";b.onclick=()=>copy(b);bar.append(b);n.append(bar);out.append(n,infoTable(p),el("div",undefined,"page-break"),scheduleTable());clip=[L.notice,L.based.replace("{time}",p.Time).replace("{date}",p.Date),dep?`${L.meet} ${dep}`:L.unresolved,"",L.info,...SHOW.map(k=>`${k}: ${p[k]??""}`)].join("\n");$("export").classList.remove("hidden");if(scroll)n.scrollIntoView({behavior:"smooth",block:"start"})}
function search(q){let box=$("results");box.replaceChildren();$("export").classList.add("hidden");if(q.length<2)return;let m=people.filter(p=>norm(p.Name).includes(q));if(!m.length){box.append(el("p",T[lang].none));return}for(const p of m){let b=el("button",String(p.Name),"name-btn");b.type="button";b.onclick=()=>{box.replaceChildren(b);b.classList.add("active");display(p,true)};box.append(b)}}
function process(buf){try{let wb=XLSX.read(buf,{type:"array"});if(!wb.SheetNames.includes(SHEET))throw Error(`Missing sheet: ${SHEET}`);let as=wb.SheetNames.filter(n=>n!==SHEET);if(!as.length)throw Error("No attendee sheet");rules=buildSchedule(wb.Sheets[SHEET]);people=as.flatMap(n=>attendee(wb.Sheets[n]));if(!people.length)throw Error("No attendee records");$("upload").classList.add("hidden");$("search").classList.remove("hidden");status("")}catch(e){console.error(e);people=[];rules=[];$("search").classList.add("hidden");status(`${T[lang].bad} ${e.message}`,true)}}
async function load(){try{let r=await fetch(`${FILE}?v=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(`HTTP ${r.status}`);process(await r.arrayBuffer())}catch(e){console.warn(e);$("upload").classList.remove("hidden");status(T[lang].load,true)}}
async function copy(b){try{await navigator.clipboard.writeText(clip);b.textContent=T[lang].copied;b.classList.add("copied");setTimeout(()=>{b.textContent=T[lang].copy;b.classList.remove("copied")},2500)}catch(e){console.error(e)}}
function pdf(){let c=$("printable").cloneNode(true);c.querySelectorAll(".no-pdf").forEach(x=>x.remove());c.querySelectorAll(".table-wrap").forEach(x=>{x.style.overflow="visible";x.style.width="100%"});html2pdf().set({margin:[.5,.5,.5,.5],filename:"Departure_Information.pdf",image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0},jsPDF:{unit:"in",format:"letter",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(c).save()}
function language(){lang=$("lang").value;let L=T[lang];document.documentElement.lang=lang;$("title").textContent=L.title;$("desc").textContent=L.desc;$("q").placeholder=L.ph;$("search-label").textContent=L.label;$("upload-msg").textContent=L.upload;$("upload-label").textContent=L.file;$("pdf").textContent=L.pdf;let q=norm($("q").value);if(q.length>=2)search(q);if(active&&!$("export").classList.contains("hidden"))display(active,false)}
$("lang").addEventListener("change",language);$("q").addEventListener("input",e=>search(norm(e.target.value)));$("pdf").addEventListener("click",pdf);$("file").addEventListener("change",e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader;r.onload=x=>process(x.target.result);r.readAsArrayBuffer(f)});language();load();
})();
</script>
</body></html>
