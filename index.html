<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Background</title>
  <style>
    body {
      background-color: #0d1117;
      margin: 0;
      overflow: hidden; /* Prevents scrollbars if the glow extends past the screen */
    }
    
    .glow-container {
      position: relative;
      height: 100vh;
      width: 100vw;
    }

    /* The interactive glow overlay */
    .glow-container::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      
      /* The gradient uses CSS variables for dynamic positioning */
      background: radial-gradient(
        600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 102, 0, 0.15),
        transparent 40%
      );
    }
  </style>
</head>
<body>
  <div class="glow-container"></div>

  <script>
    const container = document.querySelector('.glow-container');
    
    // Track mouse movement and update CSS variables directly
    container.addEventListener('mousemove', (e) => {
      container.style.setProperty('--mouse-x', `${e.clientX}px`);
      container.style.setProperty('--mouse-y', `${e.clientY}px`);
    });
  </script>
</body>
</html>
