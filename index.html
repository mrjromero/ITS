<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Background</title>
  <style>
    body {
      margin: 0;
      background-color: #0d1117;
      overflow: hidden; /* Prevents scrollbars */
    }
    
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Keeps your text on top and allows the mouse to interact with the canvas behind it */
    .content-layer {
      position: absolute;
      inset: 0;
      pointer-events: none; 
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <!-- Foreground Content -->
  <div class="content-layer">
    <h1>Move your mouse around!</h1>
  </div>

  <!-- The WebGL Canvas -->
  <canvas id="fluid-canvas"></canvas>

  <!-- Import the WebGL Fluid Simulation library via CDN -->
  <script type="module">
    import webGLFluidSimulation from 'https://cdn.skypack.dev/webgl-fluid';
    
    // Initialize the physics simulation on the canvas
    webGLFluidSimulation(document.getElementById('fluid-canvas'), {
      IMMEDIATE: true, 
      TRIGGER: 'hover',
      SIM_RESOLUTION: 128,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 1.5, /* How fast the colors fade */
      VELOCITY_DISSIPATION: 0.2, /* How fast the momentum stops */
      PRESSURE: 0.8,
      PRESSURE_ITERATIONS: 20,
      CURL: 30, /* The amount of swirl/vorticity */
      SPLAT_RADIUS: 0.25, /* Size of the mouse brush */
      SPLAT_FORCE: 6000,
      SHADING: true,
      COLORFUL: true, /* Continuously shifts colors */
      COLOR_UPDATE_SPEED: 10,
      BACK_COLOR: { r: 13, g: 17, b: 23 }, /* Matches your #0d1117 background */
      TRANSPARENT: false,
      BLOOM: true,
      BLOOM_ITERATIONS: 8,
      BLOOM_RESOLUTION: 256,
      BLOOM_INTENSITY: 0.8,
      BLOOM_THRESHOLD: 0.6,
      BLOOM_SOFT_KNEE: 0.7,
      SUNRAYS: true,
      SUNRAYS_RESOLUTION: 196,
      SUNRAYS_WEIGHT: 1.0,
    });
  </script>
</body>
</html>
